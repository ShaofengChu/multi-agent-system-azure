# ローカルデプロイには .env ファイルを作成して、下記環境変数を設定してください。
# AZURE_OPENAI_ENDPOINT=
# AZURE_OPENAI_API_KEY=
# AZURE_OPENAI_API_VERSION=
# AZURE_OPENAI_DEPLOYMENT_NAME=
# docker-compose up --build
# docker-compose down

services:
  mcp-server:
    build:
      context: ./mcp_server
    expose:
      - "8080"
    environment:
      - PORT=8080
    networks:
      - agent_internal_net

  hr-agent:
    build:
      context: ./hr_agent
    expose:
      - "8080"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-5-mini}
      - MCP_SERVER_URL=http://mcp-server:8080/mcp
      - AGENT_URL=http://hr-agent:8080
    depends_on:
      - mcp-server
    networks:
      - agent_internal_net
    stdin_open: true
    tty: true

  it-agent:
    build:
      context: ./it_agent
    expose:
      - "8080"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-5-mini}
      - MCP_SERVER_URL=http://mcp-server:8080/mcp
      - AGENT_URL=http://it-agent:8080
    depends_on:
      - mcp-server
    networks:
      - agent_internal_net
    stdin_open: true
    tty: true

  main-agent:
    build:
      context: ./main_agent
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-5-mini}
      - HR_AGENT_URL=http://hr-agent:8080
      - IT_AGENT_URL=http://it-agent:8080
    depends_on:
      - hr-agent
      - it-agent
    networks:
      - agent_internal_net
    stdin_open: true
    tty: true

networks:
  agent_internal_net:
    driver: bridge
